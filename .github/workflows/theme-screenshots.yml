name: Theme screenshots

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Optional theme id from config/github.yml"
        required: false
        type: string
      subset:
        description: "Optional marker substring (default: gallery preset)"
        required: false
        type: string
      devices:
        description: "Comma-separated SCREENSHOTS_DEVICES override"
        required: false
        default: desktop,mobile
        type: string
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: theme-screenshots
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  RAILS_ENV: test
  PGUSER: discourse
  PGPASSWORD: discourse
  CAPYBARA_DEFAULT_MAX_WAIT_TIME: 20
  MINIO_RUNNER_LOG_LEVEL: WARN
  CHEAP_SOURCE_MAPS: "1"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/dev/null"
  MINIO_RUNNER_INSTALL_DIR: /home/discourse/.minio_runner
  EMBER_ENV: development
  LOAD_PLUGINS: "1"
  QUNIT_REUSE_BUILD: 1
  THEME_SCREENSHOTS_CONFIG: config/github.yml

jobs:
  capture:
    name: Capture shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.theme != '' && '[0]' || '[0,1,2]') }}
    runs-on: ubuntu-latest
    container: discourse/discourse_test:release
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout screenshot project
        uses: actions/checkout@v6
        with:
          path: theme-screenshots

      - name: Checkout Discourse
        uses: actions/checkout@v6
        with:
          repository: discourse/discourse
          path: discourse
          fetch-depth: 1

      - name: Setup Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/theme-screenshots"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/discourse"
          git config --global user.email "ci@ci.invalid"
          git config --global user.name "Theme Screenshots CI"

      - name: Start Redis
        run: |
          # Discourse's test environment uses localhost and ignores the Redis host override.
          redis_dir=$(mktemp -d)
          redis-server --bind 127.0.0.1 --port 6379 --daemonize yes \
            --dir "$redis_dir" --pidfile "$redis_dir/redis.pid" \
            --logfile "$redis_dir/redis.log" --save "" --appendonly no
          for attempt in {1..15}; do
            if [[ "$(redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null)" == PONG ]]; then
              exit 0
            fi
            sleep 1
          done
          if [[ -r "$redis_dir/redis.log" ]]; then
            tail -n 30 "$redis_dir/redis.log"
          fi
          echo "::error::Redis did not respond on 127.0.0.1:6379"
          exit 1

      # Redis ships its own jemalloc; preloading another copy prevents it from starting.
      - name: Enable jemalloc
        run: echo /usr/lib/libjemalloc.so.1 > /etc/ld.so.preload

      - name: Start Postgres
        working-directory: discourse
        run: |
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE $PGUSER LOGIN SUPERUSER PASSWORD '$PGPASSWORD';"

      - name: Symlink vendor/bundle from image
        working-directory: discourse
        run: ln -s /var/www/discourse/vendor/bundle vendor/bundle

      - name: Setup Discourse gems
        working-directory: discourse
        run: |
          bundle config --local path vendor/bundle
          bundle config --local deployment true
          bundle config --local without development
          bundle install --jobs $(($(nproc) - 1))
          bundle clean

      - name: Install Discourse JavaScript dependencies
        working-directory: discourse
        run: pnpm install --frozen-lockfile

      - name: Create and migrate database
        working-directory: discourse
        run: |
          bin/rake db:create
          script/silence_successful_output bin/rake db:migrate

      - name: Build Discourse assets for system specs
        working-directory: discourse
        run: script/assemble_ember_build.rb

      - name: Install Playwright Chromium
        working-directory: discourse
        run: pnpm playwright install --with-deps --no-shell chromium

      - name: Capture theme screenshots
        working-directory: theme-screenshots
        env:
          CHECKOUT_TIMEOUT: 10
          RAILS_ENABLE_TEST_LOG: 1
          RAILS_TEST_LOG_LEVEL: error
          THEME_INPUT: ${{ github.event.inputs.theme }}
          SUBSET_INPUT: ${{ github.event.inputs.subset }}
          DEVICES_INPUT: ${{ inputs.devices }}
          SHARD: ${{ matrix.shard }}
        run: |
          ruby bin/install-gallery-preset ../discourse
          args=(--config "$THEME_SCREENSHOTS_CONFIG" --out public --subset "${SUBSET_INPUT:-gallery}")
          if [ -n "$THEME_INPUT" ]; then
            args+=(--theme "$THEME_INPUT")
          else
            args+=(--shard "$SHARD")
          fi
          if [ -n "$DEVICES_INPUT" ]; then
            args+=(--devices "$DEVICES_INPUT")
          fi
          ruby bin/screenshot-themes "${args[@]}"
          ruby bin/verify-output --out public

      - name: Upload raw screenshot artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: theme-screenshots-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          path: theme-screenshots/public
          retention-days: 2

  assemble:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (inputs.theme == '' && (inputs.subset == '' || inputs.subset == 'gallery') && (inputs.devices == '' || inputs.devices == 'desktop,mobile')))
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@v8
        with:
          pattern: theme-screenshots-shard-*
          path: shards
      - name: Merge and verify gallery
        run: |
          ruby bin/merge-gallery config/github.yml shards public
          ruby bin/verify-output --out public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
          retention-days: 2

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
